# The host-side workspace: the shared firmware crate and the xtask runner.
# The firmwares (vocat/, korvo/) build for their chips with their own
# toolchains, so they are separate packages; `cargo xtask` drives them.
[workspace]
resolver = "2"
members  = ["common", "xtask"]
exclude  = ["vocat", "korvo"]

[workspace.package]
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/Hahihula/whistle-esp"

[workspace.dependencies]
# Local paths while developing; git tags once released:
# cactus-whistle = "0.1"
# esp-pie        = { git = "https://github.com/Hahihula/esp-pie", tag = "v0.1.0" }
cactus-whistle = { path = "../cactus-whistle-rs/whistle" }
esp-pie        = { path = "../esp-pie" }
