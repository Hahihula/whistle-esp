[package]
edition      = "2024"
name         = "korvo-whistle"
rust-version = "1.95"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"
publish      = false

[dependencies]
# The engine (pure Rust, from crates.io once published).
cactus-whistle = { path = "../../cactus-whistle-rs/whistle", features = ["riscv-fpu"] }
# cactus-whistle = { version = "0.1", features = ["riscv-fpu"] }
# PIE int8 dot products, installed into the engine by whistle-common.
esp-pie = { path = "../../esp-pie", features = ["esp32s31"] }
# Inference core, helper core, audio and text helpers shared with vocat/.
whistle-common = { path = "../common" }
# esp-pie = { git = "https://github.com/Hahihula/esp-pie", tag = "v0.1.0", features = ["esp32s31"] }
# Board support: LCD, buttons, ES8389 microphones over I2S.
esp32-s31-korvo = { path = "../../s31-rust-examples/esp32-s31-korvo" }
# esp32-s31-korvo = { git = "https://github.com/Hahihula/s31-korvo-1-rust-examples", tag = "v0.1.0" }

esp-hal                = { version = "1.2", features = ["esp32s31", "log-04", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp32s31", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s31", "log-04"] }
esp-alloc              = { version = "0.11.0", features = ["esp32s31"] }
esp-backtrace          = { version = "0.20.0", features = ["esp32s31", "panic-handler", "println"] }
esp-println            = { version = "0.18.0", features = ["esp32s31", "log-04"] }
log                    = "0.4.27"
embassy-executor       = { version = "0.10.0", features = ["log"] }
embassy-time           = { version = "0.5.0", features = ["log"] }
critical-section       = "1.2.0"
static_cell            = "2.1.1"
embassy-futures        = "0.1"
embassy-sync           = "0.8"
embedded-graphics      = "0.8"
libm                   = "0.2"
embedded-hal-async     = "1.0"

# The ESP32-S31 support in the released crates is incomplete, so the esp-rs
# stack is pinned to the esp-hal `main` commit esp32-s31-korvo uses.
[patch.crates-io]
esp-hal                = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-rtos               = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-alloc              = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-println            = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-backtrace          = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "33f9b0f7c36ac47edbd015808b5399090fc1f9b6" }

[features]
# Greedy decoding (Spec::GuideFast): about half the decoding time of the
# default 5-beam search, ~3 WER points worse.
fast = ["cactus-whistle/fast"]
# Transcribe a built-in clip at boot and log its timings and encoder
# checksum (for development and automated checks; the board is busy for
# ~20 s). `cargo run-vocat --selftest` / `cargo run-korvo --selftest`.
selftest = []
# The boot splash (espressif, a heart, cactuscompute) at boot. It is off by
# default: a production firmware does not need the animation, its marks and
# the time it takes. `cargo run-vocat --splash` / `cargo run-korvo --splash`.
splash = ["whistle-common/splash"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = 3
