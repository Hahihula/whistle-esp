# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
# The model lives in its own partition (see partitions.csv and the README);
# flash it once from the repository root with: cargo flash-model vocat
# DIO at 80 MHz. Not QIO: espflash writes the mode into the bootloader header
# too, and the S3 ROM then fails to load the bootloader ("ets_loader.c 78",
# watchdog reset loop). ESP-IDF keeps the bootloader at DIO and switches later.
runner = "espflash flash --monitor --chip esp32s3 --partition-table partitions.csv --flash-mode dio --flash-freq 80mhz"

[build]
rustflags = ["-C", "link-arg=-nostartfiles"]
target    = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
