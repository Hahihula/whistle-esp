[package]
edition      = "2024"
name         = "p4-whistle"
rust-version = "1.95"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"
publish      = false

[dependencies]
# The engine (pure Rust).
cactus-whistle = { git = "https://github.com/Hahihula/cactus-whistle-rs", tag = "v0.1.0", features = ["riscv-fpu"] }
# PIE int8 dot products, installed into the engine by whistle-common.
esp-pie = { git = "https://github.com/Hahihula/esp-pie", tag = "v0.2.0", features = ["esp32p4"] }
# Inference core, helper core, audio and text helpers shared with vocat/ and korvo/.
whistle-common = { path = "../common" }
# Board support: 7" MIPI-DSI LCD, ES8311 microphone over I2S, BOOT button.
esp32-p4-function-ev = { git = "https://github.com/Hahihula/ESP32-P4X-Function-EV-Board-rust-examples", tag = "v0.1.0" }

# `unstable`: the ESP32-P4's I2S, MIPI-DSI, PSRAM and DMA drivers are still
# behind esp-hal's unstable feature (pinned like esp32-p4-function-ev).
esp-hal                = { version = "~1.2.2", features = ["esp32p4", "log-04", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp32p4", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32p4", "log-04"] }
esp-alloc              = { version = "0.11.0", features = ["esp32p4"] }
esp-backtrace          = { version = "0.20.0", features = ["esp32p4", "panic-handler", "println"] }
esp-println            = { version = "0.18.0", features = ["esp32p4", "log-04"] }
log                    = "0.4.27"
embassy-executor       = { version = "0.10.0", features = ["log"] }
embassy-time           = { version = "0.5.0", features = ["log"] }
static_cell            = "2.1.1"
embassy-futures        = "0.1"
embassy-sync           = "0.8"
embedded-graphics      = "0.8"

[features]
# Greedy decoding (Spec::GuideFast): about half the decoding time of the
# default 5-beam search, ~3 WER points worse.
fast = ["cactus-whistle/fast"]
# Transcribe a built-in clip at boot and log its timings and encoder
# checksum (for development and automated checks). `cargo run-p4 --selftest`.
selftest = []

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = 3
